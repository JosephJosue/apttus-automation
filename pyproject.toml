[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apttus-delta"
version = "0.1.0"
description = "Python/pandas port of the Apttus catalogue release-delta Power Query automation"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
apttus-delta = "apttus_delta.cli:main"

[tool.setuptools]
packages = ["apttus_delta"]

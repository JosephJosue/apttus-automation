# Configuration for the apttus-delta pipeline.
#
# The tool lives in the python-automation/ subfolder of your "Apttus
# Automation" data folder, so data_dir defaults to ".." (one level up) and
# normally needs no editing:
#
#   Apttus Automation/
#   ├── 00. Previous Release/
#   ├── 01. Current Release/
#   ├── SOQL Exports/            (prod/ and itest4/ inside)
#   ├── Output/
#   ├── Split/
#   └── python-automation/       <- this folder (the code + this file)
#
# Only change data_dir if the data lives somewhere else, e.g.:
#   data_dir: "C:/Users/<you>/Philips/PST Onboard Business and Markets - Documents/Catalogue Releases/Apttus Automation"
data_dir: ".."

# All of these live inside data_dir (override with absolute paths if needed).
paths:
  current_release: "01. Current Release"
  previous_release: "00. Previous Release"
  soql_exports: "SOQL Exports"   # manual Salesforce export drop folder
  output: "Output"               # delta workbooks + run report
  split: "Split"                 # per-country split output
  apttus_files: "Apttus Files"   # legacy workbooks (only used by `verify`)
  validation: "Validation"       # legacy validation folder (only used by `verify`)

org_profile: prod                # prod | itest4 -> reads SOQL Exports/<org_profile>/
                                 # override per run with:  --org itest4
release_date: null               # YYYY-MM-DD; null = today; stamps output file names
export_max_age_days: 7           # older org exports fail the freshness check
strict_columns: true             # unexpected columns in an export = hard fail
datasets: all                    # or a list of registry keys, e.g. [L07, L09]

# quoted: unquoted NO would be parsed as YAML boolean false
split_countries: ["BE", "NL", "PT", "ES", "DK", "FI", "SE", "NO", "FR", "DE", "CH", "AT", "IT", "GB", "IE"]
